[package]
name = "condukt-wasm"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE.md"
description = "Host-driven Condukt agent sessions for WebAssembly environments"
repository = "https://github.com/tuist/condukt"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
condukt-inference.workspace = true
condukt-protocol.workspace = true
condukt-session.workspace = true
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
