[workspace]
members = [
  "crates/condukt-inference",
  "crates/condukt-protocol",
  "crates/condukt-session",
  "crates/condukt-wasm",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "0.2"

condukt-protocol = { path = "crates/condukt-protocol" }
condukt-inference = { path = "crates/condukt-inference" }
condukt-session = { path = "crates/condukt-session" }
condukt-wasm = { path = "crates/condukt-wasm" }
