name: Condukt CLI

on:
  pull_request:
    paths:
      - "cli/**"
      - "packages/condukt/**"
      - "lib/**"
      - "mix.exs"
      - "mix.lock"
      - "mise.toml"
      - ".github/workflows/condukt-cli.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "packages/condukt/**"
      - "lib/**"
      - "mix.exs"
      - "mix.lock"
      - "mise.toml"
      - ".github/workflows/condukt-cli.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # The terminal agent never uses the virtual or microVM sandboxes: it works in
  # the user's real workspace. Compiling both NIFs as stubs keeps the CI image
  # free of their native dependencies and matches how the released binary is
  # built, where a glibc library could not load under burrito's musl runtime.
  CONDUKT_BASHKIT_DISABLE: "1"
  CONDUKT_MICROSANDBOX_DISABLE: "1"

jobs:
  cli:
    name: Terminal agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      # Only the tools this job needs: the repository also pins cluster and
      # release tooling that has nothing to do with building the agent, and some
      # of it has no build for every runner architecture.
      - name: Install BEAM tooling with mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          cache: true
          install_args: "erlang elixir zig"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo --strict

      - name: Run tests
        run: mix test

  release_build:
    name: Wrapped binary builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    env:
      MIX_ENV: prod
      BURRITO_TARGET: linux
      # Burrito's linux wrapper runs a musl runtime, so the bundled renderer
      # has to be the musl artifact.
      TARGET_ABI: musl
    steps:
      - uses: actions/checkout@v4

      # Only the tools this job needs: the repository also pins cluster and
      # release tooling that has nothing to do with building the agent, and some
      # of it has no build for every runner architecture.
      - name: Install BEAM tooling with mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          cache: true
          install_args: "erlang elixir zig"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Build the wrapped binary
        run: mix release --overwrite

      - name: Exercise the binary
        run: |
          ./burrito_out/condukt_linux --version
          ./burrito_out/condukt_linux --help
          ./burrito_out/condukt_linux files

  browser_crates:
    name: Browser crates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/condukt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: browser-crates
          workspaces: packages/condukt
      - name: cargo build
        run: cargo build --verbose --all-targets
        env:
          RUSTFLAGS: -D warnings
      - name: cargo test
        run: cargo test --verbose --all-targets
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- --deny warnings
      - name: cargo fmt
        run: cargo fmt --all -- --check

  wasm_package:
    name: WebAssembly package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install_args: "rust node cargo:wasm-pack"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: cli-wasm
          workspaces: packages/condukt
      - name: Add WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      # wasm-pack resolves --out-dir relative to the crate, not the working
      # directory, so the path is absolute and the artifacts land straight in
      # the package. --out-name matches web/Dockerfile so both surfaces emit
      # the same condukt_wasm.js the package entry point imports.
      - name: Build package
        run: |
          rm -rf packages/condukt/generated
          wasm-pack build packages/condukt/crates/condukt-wasm \
            --target web \
            --out-dir "$GITHUB_WORKSPACE/packages/condukt/generated" \
            --out-name condukt_wasm \
            --release
      - name: Exercise package in Node.js
        working-directory: packages/condukt
        run: node --test test/*.test.mjs
