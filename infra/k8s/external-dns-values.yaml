# external-dns watches the Condukt site Ingress and keeps the Cloudflare record
# for condukt.tuist.dev in sync with the ingress-nginx LoadBalancer address.
#
# The Cloudflare API token is created out-of-band as a Kubernetes Secret by the
# cluster bootstrap procedure so it never lands in Helm values or release
# history.
#
# The domain filter is the fully qualified name rather than the tuist.dev zone:
# the zone holds records owned by other systems, and this controller has no
# business reconciling them. `upsert-only` plus a dedicated txtOwnerId means a
# mistake here cannot delete a record this cluster did not create.

provider:
  name: cloudflare

sources:
  - ingress

domainFilters:
  - condukt.tuist.dev

policy: upsert-only
registry: txt
txtOwnerId: condukt-production
interval: 1m
triggerLoopOnEvent: false

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: token
